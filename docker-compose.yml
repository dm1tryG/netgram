services:
  netgram:
    build: .
    container_name: netgram
    ports:
      - "3000:3000"
    # TG_API_ID / TG_API_HASH / TG_PHONE come from .env (not baked into the image).
    env_file:
      - .env
    environment:
      - NETGRAM_DATA_DIR=/data
    # Persists the Telegram session, allowlist and drafts across restarts.
    volumes:
      - ./data:/data
    restart: unless-stopped
